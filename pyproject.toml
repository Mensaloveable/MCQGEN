[project]
name = "mcqgen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdullahi Adedayo", email = "abdullahi.adedayo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcqgen = "mcqgen:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
